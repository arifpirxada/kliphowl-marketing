[project]
name = "kliphowl-marketing"
version = "0.1.0"
description = "Prospect intelligence and cold outreach automation for KlipHowl"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
marketing = "src.cli:main"
discover = "src.discovery.search_prospects:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
